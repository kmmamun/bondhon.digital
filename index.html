    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * { 
            box-sizing: border-box; 
        }
        
        html, body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: #f8f9fd; 
            color: #111827; 
        }

        .progress-circle { 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .progress-circle::before { 
            content: ""; 
            position: absolute; 
            inset: 12px; 
            background-color: white; 
            border-radius: 50%; 
        }

        .no-scrollbar::-webkit-scrollbar { 
            display: none; 
        }

        .no-scrollbar { 
            -ms-overflow-style: none; 
            scrollbar-width: none; 
        }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .animate-slide-up { 
            animation: slideUp 0.4s ease forwards; 
        }

        @keyframes toastSlideIn { 
            from { transform: translateY(-100%); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }

        @keyframes toastSlideOut { 
            from { transform: translateY(0); opacity: 1; } 
            to { transform: translateY(-100%); opacity: 0; } 
        }

        .toast-enter { 
            animation: toastSlideIn 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .toast-exit { 
            animation: toastSlideOut 0.3s forwards; 
        }

<body>
    <div id="root"></div>

    <script>
        if ('serviceWorker' in navigator) {
            const hadController = !!navigator.serviceWorker.controller;
            let reloaded = false;
            // নতুন sw.js চালু হলে একবার অটো-রিলোড (যাতে পুরোনো ক্যাশ না থাকে)
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!hadController || reloaded) return;
                reloaded = true;
                window.location.reload();
            });
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=13').then(reg => reg.update()).catch(() => {}); // Cache buster updated
            });
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ===== বছরভিত্তিক সদস্য ট্যাব =====
        // প্রতি বছরের জন্য Google Sheet ট্যাবের gid এখানে বসান। gid ফাঁকা থাকলে সেই বছর অ্যাপে দেখাবে না।
        // নতুন বছরের জন্য: পুরনো ট্যাব কপি করে মাসের ঘর ফাঁকা করুন, ট্যাবের নাম দিন "Member Info-Apps 2027",
        // তারপর ট্যাবের URL-এর gid=XXXX অংশটি নিচে বসান।
        const SHEET_FILE_EXPORT = 'https://docs.google.com/spreadsheets/d/1q-TZj3ur3FtPMB1Z2Ppq9tG8DUAyRhLObzxo4PEVlFs/export?format=csv&gid=';
        const YEAR_SHEETS = {
            2026: '2103360002',
            2027: '122218516'
        };
        const YEARS = Object.keys(YEAR_SHEETS).filter(y => YEAR_SHEETS[y]).map(Number).sort((a, b) => a - b);
        const memberSheetUrl = (year) => SHEET_FILE_EXPORT + YEAR_SHEETS[year];
        // ===== পূর্ববর্তী বছরের জের (Opening Balance) =====
        // Sheet-এ "Opening Balance" নামে ট্যাব বানান (A=Year, B=Amount, C=Note), তারপর তার gid এখানে বসান।
        // gid ফাঁকা থাকলে জের দেখানো ও যোগ করা বন্ধ থাকবে।
        const OPENING_BALANCE_GID = '1527953527';
        const OPENING_BALANCE_URL = OPENING_BALANCE_GID ? SHEET_FILE_EXPORT + OPENING_BALANCE_GID : '';
        // ===== চাঁদা পরিশোধের অ্যাকাউন্ট (বন্ধন হিসাব) =====
        // নতুন অ্যাকাউন্ট (নগদ/ব্যাংক) যোগ করতে এখানে আরেকটি লাইন যোগ করুন।
        const PAYMENT_ACCOUNTS = [
            { name: 'বিকাশ', number: '01999708877' }
        ];
        const BLOOD_GROUPS = ['A(+)', 'A(-)', 'B(+)', 'B(-)', 'AB(+)', 'AB(-)', 'O(+)', 'O(-)'];
        const EMPTY_LIST = [];
        const GENERAL_DONATION_LABEL = 'অন্যান্য (ইভেন্ট ছাড়া)';
        const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
        const isoToSheetDate = (iso) => { const [y, m, d] = iso.split('-'); return `${d}-${MONTH_ABBR[Number(m) - 1]}-${y.slice(2)}`; };
        const normName = (t) => (t || '').normalize('NFC').replace(/[\u200B-\u200D\uFEFF]/g, '').replace(/\s+/g, ' ').trim();
        const toBn = (n) => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
        const toEnDigits = (t) => String(t == null ? '' : t).replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
        const MONTH_IDX = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
        const BN_MONTHS = ['জানু', 'ফেব্রু', 'মার্চ', 'এপ্রি', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টে', 'অক্টো', 'নভে', 'ডিসে'];
        // শিটের বিভিন্ন ফরম্যাটের তারিখ (MM/dd/yyyy, dd-MMM-yy, dd-MM-yyyy, yyyy-mm-dd, বাংলা অঙ্ক) পড়ে Date বানায়
        const parseAnyDate = (raw) => {
            const t = toEnDigits(raw).trim();
            if (!t) return null;
            let m;
            if ((m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1], +m[2] - 1, +m[3]);
            if ((m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return new Date(+m[3], +m[1] - 1, +m[2]);
            if ((m = t.match(/^(\d{1,2})-([A-Za-z]{3})[A-Za-z]*-(\d{2,4})$/))) {
                const mo = MONTH_IDX[m[2].toLowerCase()];
                if (mo !== undefined) { let y = +m[3]; if (y < 100) y += 2000; return new Date(y, mo, +m[1]); }
            }
            if ((m = t.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/))) return new Date(+m[3], +m[2] - 1, +m[1]);
            const d = new Date(t);
            return isNaN(d.getTime()) ? null : d;
        };
        const fmtBnDate = (d) => `${toBn(d.getDate())} ${BN_MONTHS[d.getMonth()]} ${toBn(d.getFullYear())}`;
        const dateToISO = (raw) => {
            const d = parseAnyDate(raw);
            if (!d) return '';
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${d.getFullYear()}-${mm}-${dd}`;
        };
        const isoToLongDate = (iso) => { const [y, m, d] = iso.split('-'); return `${d}-${MONTH_ABBR[Number(m) - 1]}-${y}`; };
        const fmtMoney = (n) => Number(n || 0).toLocaleString('en-IN');

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-500' : 'bg-gray-800';
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            
            return (
                <div className="fixed top-4 left-0 right-0 z-[100] flex justify-center px-4 pointer-events-none">
                    <div className={`${bgColor} text-white px-5 py-3 rounded-2xl shadow-lg flex items-center gap-3 toast-enter max-w-sm w-full`}>
                        <i className={`fas ${icon} text-lg`}></i>
                        <span className="font-semibold text-sm">{message}</span>
                    </div>
                </div>
            );
        };

        const BondhanApp = () => {
            // Navigation States
            const [activeTab, setActiveTab] = useState('home'); 
            const [selectedMemberId, setSelectedMemberId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            
            // Data States
            const [yearData, setYearData] = useState({});
            const [allYears, setAllYears] = useState(false);
            const [selectedYear, setSelectedYear] = useState(() => {
                const cy = new Date().getFullYear();
                return YEARS.includes(cy) ? cy : YEARS[YEARS.length - 1];
            });
            const setMembersData = (updater) => setYearData(prev => ({
                ...prev,
                [selectedYear]: typeof updater === 'function' ? updater(prev[selectedYear] || []) : updater
            }));
            const [expensesData, setExpensesData] = useState([]);
            const [eventsData, setEventsData] = useState([]);
            const [notices, setNotices] = useState([]);
            const [aboutUsText, setAboutUsText] = useState(''); 
            
            // Modal States
            const [showNotices, setShowNotices] = useState(false);
            const [showExpenseList, setShowExpenseList] = useState(false);
            const [showAboutUs, setShowAboutUs] = useState(false); 
            const [showJoinForm, setShowJoinForm] = useState(false);
            const [showEvents, setShowEvents] = useState(false);
            const [expandedEventId, setExpandedEventId] = useState(null);
            
            // UI States
            const [loading, setLoading] = useState(true);
            const [syncStatus, setSyncStatus] = useState('Syncing...');
            const [theme, setTheme] = useState(localStorage.getItem('bondhanTheme') || 'green');
            const [greeting, setGreeting] = useState('');
            const [toast, setToast] = useState(null); 
            
            // Authorization States
            const [isAuthorized, setIsAuthorized] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const SECRET_PIN = '1722'; 
            
            // Edit & Form Features
            const [showEditPinModal, setShowEditPinModal] = useState(false);
            const [editTarget, setEditTarget] = useState(null); 
            const [deleteEventTarget, setDeleteEventTarget] = useState(null);
            const [editingEvent, setEditingEvent] = useState(null);
            const [showProfileEditForm, setShowProfileEditForm] = useState(false);
            const [showPaymentEditForm, setShowPaymentEditForm] = useState(false);
            const [showDonationEditForm, setShowDonationEditForm] = useState(false);
            const [showAddNoticeForm, setShowAddNoticeForm] = useState(false);
            const [showAddExpenseForm, setShowAddExpenseForm] = useState(false);
            const [showAddEventForm, setShowAddEventForm] = useState(false);
            
            // Input States for Forms
            const [editPinInput, setEditPinInput] = useState('');
            const [editData, setEditData] = useState({});
            const [paymentData, setPaymentData] = useState({ month: '', amount: '' });
            const [isEditingMonths, setIsEditingMonths] = useState(false);
            const [monthEdits, setMonthEdits] = useState({});
            const [donationData, setDonationData] = useState({ amount: '', eventId: '', date: '' });
            const [donationsList, setDonationsList] = useState([]);
            const [openingList, setOpeningList] = useState([]);
            const [txFilter, setTxFilter] = useState('all');
            const [showAllTx, setShowAllTx] = useState(false);
            const [showQuickAdd, setShowQuickAdd] = useState(false);
            const [showAddMemberForm, setShowAddMemberForm] = useState(false);
            const [newMemberData, setNewMemberData] = useState({});
            const [breakdownMemberId, setBreakdownMemberId] = useState(null);
            const [donFilterMember, setDonFilterMember] = useState('');
            const [donFilterEvent, setDonFilterEvent] = useState('');

            // সদস্যের ডোনেশন = Donations শিটে ওই সদস্যের ওই বছরের সব রেকর্ডের যোগফল
            const yearDataFull = useMemo(() => {
                const totals = {};
                donationsList.forEach(d => {
                    const key = `${d.year}|${d.memberId}`;
                    totals[key] = (totals[key] || 0) + d.amount;
                });
                const out = {};
                Object.keys(yearData).forEach(y => {
                    out[y] = yearData[y].map(m => {
                        const don = totals[`${y}|${m.id}`] || 0;
                        return { ...m, donation: don, totalYearly: (m.monthlyPaidTotal || 0) + don };
                    });
                });
                return out;
            }, [yearData, donationsList]);
            const membersData = yearDataFull[selectedYear] || EMPTY_LIST;
            const allMembersList = useMemo(() => {
                const map = {};
                Object.keys(yearDataFull).sort().forEach(y => yearDataFull[y].forEach(m => { map[m.id] = { id: m.id, name: m.name }; }));
                return Object.values(map).sort((a, b) => a.name.localeCompare(b.name));
            }, [yearDataFull]);
            const [newNoticeData, setNewNoticeData] = useState({ title: '', message: '' });
            const [newExpenseData, setNewExpenseData] = useState({ purpose: '', customPurpose: '', amount: '', date: todayISO() });
            const [newEventData, setNewEventData] = useState({ date: '', name: '', details: '' });
            
            const [isUpdating, setIsUpdating] = useState(false);
            
            // =========================================================================
            // লিংক কনফিগারেশন 
            // =========================================================================
            const GOOGLE_FORM_URL = 'https://forms.gle/2K9AST9ALqRqybho7';
            const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwiiAiB3SfB0xtw36fobz41Ce8R16BGNkFo9As7ocRUh0MORzP26s5mM0b8u0xmbdny/exec';

            // সব ট্যাব এখন একই ফাইল থেকে (2026 Bondhon Member Directory-Updated)
            const NOTICE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1q-TZj3ur3FtPMB1Z2Ppq9tG8DUAyRhLObzxo4PEVlFs/export?format=csv&gid=1980828362';
            const ABOUT_US_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1q-TZj3ur3FtPMB1Z2Ppq9tG8DUAyRhLObzxo4PEVlFs/export?format=csv&gid=1375885684';
            const EXPENSE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1q-TZj3ur3FtPMB1Z2Ppq9tG8DUAyRhLObzxo4PEVlFs/export?format=csv&gid=429716275'; 
            const EVENTS_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1q-TZj3ur3FtPMB1Z2Ppq9tG8DUAyRhLObzxo4PEVlFs/export?format=csv&gid=1862330748';
            const DONATIONS_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1q-TZj3ur3FtPMB1Z2Ppq9tG8DUAyRhLObzxo4PEVlFs/export?format=csv&gid=1738454596';
            // =========================================================================

            const themeStyles = {
                green: { 
                    name: 'Green (Brand)', primary: 'bg-emerald-600', hover: 'hover:bg-emerald-700', 
                    accent: 'text-emerald-600', bgLight: 'bg-emerald-50', border: 'border-emerald-100', 
                    hex: '#059669', gradient: 'from-emerald-600 to-green-400' 
                },
                gray: { 
                    name: 'Gray (Roof)', primary: 'bg-slate-600', hover: 'hover:bg-slate-700', 
                    accent: 'text-slate-600', bgLight: 'bg-slate-100', border: 'border-slate-200', 
                    hex: '#475569', gradient: 'from-slate-600 to-gray-400' 
                },
                red: { 
                    name: 'Red (Figure)', primary: 'bg-rose-600', hover: 'hover:bg-rose-700', 
                    accent: 'text-rose-600', bgLight: 'bg-rose-50', border: 'border-rose-100', 
                    hex: '#e11d48', gradient: 'from-rose-600 to-pink-500' 
                },
                yellow: { 
                    name: 'Yellow (Figure)', primary: 'bg-amber-500', hover: 'hover:bg-amber-600', 
                    accent: 'text-amber-600', bgLight: 'bg-amber-50', border: 'border-amber-100', 
                    hex: '#f59e0b', gradient: 'from-amber-500 to-yellow-400' 
                },
                purple: { 
                    name: 'Purple (Figure)', primary: 'bg-fuchsia-600', hover: 'hover:bg-fuchsia-700', 
                    accent: 'text-fuchsia-600', bgLight: 'bg-fuchsia-50', border: 'border-fuchsia-100', 
                    hex: '#c026d3', gradient: 'from-fuchsia-600 to-purple-400' 
                }
            };

            const currentTheme = themeStyles[theme] || themeStyles.green;

            useEffect(() => { 
                localStorage.setItem('bondhanTheme', theme); 
            }, [theme]);

            useEffect(() => {
                const hour = new Date().getHours();
                if (hour >= 5 && hour < 12) setGreeting('শুভ সকাল 🌅');
                else if (hour >= 12 && hour < 17) setGreeting('শুভ অপরাহ্ন ☀️');
                else if (hour >= 17 && hour < 20) setGreeting('শুভ সন্ধ্যা 🌇');
                else setGreeting('শুভ রাত্রি 🌙');
                
                fetchAllData();
            }, []);

            // অ্যাপ আবার ওপেন/ফোকাস হলে, নেট ফিরলে এবং প্রতি ২ মিনিটে অটো-রিফ্রেশ
            useEffect(() => {
                const refresh = () => fetchAllData(true);
                const onVisible = () => { if (document.visibilityState === 'visible') refresh(); };
                document.addEventListener('visibilitychange', onVisible);
                window.addEventListener('online', refresh);
                const timer = setInterval(() => {
                    if (document.visibilityState === 'visible') refresh();
                }, 120000);
                return () => {
                    document.removeEventListener('visibilitychange', onVisible);
                    window.removeEventListener('online', refresh);
                    clearInterval(timer);
                };
            }, []);

            const showToast = (message, type = 'success') => setToast({ message, type });

            const fetchAllData = (silent = false) => {
                fetchMembersFromSheets(silent === true);
                fetchNotices();
                fetchAboutUs();
                fetchExpenses();
                fetchEvents();
                fetchDonations();
                fetchOpeningBalance();
            };

            const isValidCSV = (text) => {
                return !text.includes('<!DOCTYPE html>') && !text.includes('<script>');
            };

            // সঠিক CSV পার্সার: কোটের ভেতরের কমা, নতুন লাইন (Enter) ও \r\n সব হ্যান্ডেল করে
            const parseCSV = (text) => {
                const rows = [];
                let row = [];
                let cell = '';
                let inQuotes = false;
                if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

                for (let i = 0; i < text.length; i++) {
                    const ch = text[i];
                    if (inQuotes) {
                        if (ch === '"') {
                            if (text[i + 1] === '"') { cell += '"'; i++; }
                            else inQuotes = false;
                        } else {
                            cell += ch;
                        }
                    } else if (ch === '"') {
                        inQuotes = true;
                    } else if (ch === ',') {
                        row.push(cell.trim());
                        cell = '';
                    } else if (ch === '\n' || ch === '\r') {
                        if (ch === '\r' && text[i + 1] === '\n') i++;
                        row.push(cell.trim());
                        cell = '';
                        if (row.some(c => c !== '')) rows.push(row);
                        row = [];
                    } else {
                        cell += ch;
                    }
                }
                row.push(cell.trim());
                if (row.some(c => c !== '')) rows.push(row);
                return rows;
            };

            const fetchExpenses = async () => {
                try {
                    const response = await fetch(`${EXPENSE_SHEET_URL}&t=${new Date().getTime()}`, { cache: 'no-store' });
                    if(!response.ok) return;
                    
                    const csvText = await response.text();
                    if(!isValidCSV(csvText)) return;
                    
                    const rows = parseCSV(csvText);
                    const expList = [];
                    
                    for (let i = 1; i < rows.length; i++) {
                        const cells = rows[i];
                        if(cells[1]) {
                            expList.push({ 
                                date: cells[0], 
                                purpose: cells[1], 
                                amount: parseFloat(cells[2]) || 0 
                            });
                        }
                    }
                    setExpensesData(expList.reverse());
                } catch (error) { 
                    console.error('Expense fetch error:', error); 
                }
            };

            // Events শিট: A=Date, B=Program Name, C=Details, D=Expense (৳)
            const fetchEvents = async () => {
                try {
                    const response = await fetch(`${EVENTS_SHEET_URL}&t=${new Date().getTime()}`, { cache: 'no-store' });
                    if (!response.ok) return;

                    const csvText = await response.text();
                    if (!isValidCSV(csvText)) return;

                    const rows = parseCSV(csvText);
                    const evList = [];

                    for (let i = 1; i < rows.length; i++) {
                        const cells = rows[i];
                        if (cells[2]) {
                            evList.push({
                                id: cells[0] || '',
                                row: i + 1,
                                date: cells[1] || '',
                                name: cells[2],

                                    </div>
                                    <div className="flex justify-between text-xs text-gray-500 px-1 pt-1">
                                        <span>প্রত্যাশিত বার্ষিক চাঁদা: ৳ {fmtMoney(breakdownMember.expectedYearly)}</span>
                                        <span>বকেয়া: <b className="text-rose-500">৳ {fmtMoney(breakdownMember.unpaid)}</b></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Quick Add Sheet */}
                    {showQuickAdd && (
                        <div className="fixed inset-0 z-50 flex flex-col justify-end bg-gray-900/40 backdrop-blur-sm p-4" onClick={() => setShowQuickAdd(false)}>
                            <div className="bg-white w-full max-w-md mx-auto rounded-3xl p-5 shadow-2xl animate-slide-up" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-gray-900">দ্রুত যোগ করুন</h3>
                                    <button onClick={() => setShowQuickAdd(false)} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500"><i className="fas fa-times"></i></button>
                                </div>
                                <div className="space-y-2.5">
                                    {[
                                        { t: 'donation_new', icon: 'fa-hand-holding-heart', tint: 'bg-emerald-50 text-emerald-600', title: 'নতুন ডোনেশন', sub: 'সদস্য, ইভেন্ট ও তারিখ বেছে ডোনেশন যোগ করুন' },
                                        { t: 'add_expense', icon: 'fa-minus', tint: 'bg-rose-50 text-rose-600', title: 'নতুন খরচ', sub: 'ইভেন্ট বা অন্যান্য খাতে খরচ লিখুন' },
                                        { t: 'add_notice', icon: 'fa-bullhorn', tint: currentTheme.bgLight + ' ' + currentTheme.accent, title: 'নোটিশ', sub: 'সবাইকে জানাতে নোটিশ দিন' },
                                        { t: 'add_event', icon: 'fa-calendar-plus', tint: 'bg-blue-50 text-blue-600', title: 'নতুন প্রোগ্রাম', sub: 'কার্যক্রমের তালিকায় প্রোগ্রাম যোগ করুন' },
                                        { t: 'add_member', icon: 'fa-user-plus', tint: 'bg-violet-50 text-violet-600', title: 'নতুন সদস্য', sub: 'সদস্য তালিকায় নতুন সদস্য যোগ করুন' }
                                    ].map(o => (
                                        <button key={o.t} onClick={() => { setShowQuickAdd(false); setEditTarget(o.t); setShowEditPinModal(true); }} className="w-full flex items-center gap-3 p-3 rounded-2xl bg-gray-50 hover:bg-gray-100 active:scale-[0.99] transition text-left">
                                            <span className={`w-11 h-11 rounded-2xl flex items-center justify-center text-lg ${o.tint}`}><i className={`fas ${o.icon}`}></i></span>
                                            <span className="flex-1"><span className="block font-semibold text-gray-800 text-sm">{o.title}</span><span className="block text-[11px] text-gray-400">{o.sub}</span></span>
                                            <i className="fas fa-chevron-right text-gray-300 text-xs"></i>
                                        </button>
                                    ))}
                                </div>
                                <div className="mt-4 p-3 rounded-2xl bg-amber-50 text-[11px] text-amber-700 flex items-start gap-2">
                                    <i className="fas fa-info-circle mt-0.5"></i>
                                    <span>মাসিক চাঁদা যোগ করতে সদস্যের প্রোফাইল খুলুন।</span>
                                    <button onClick={() => { setShowQuickAdd(false); setActiveTab('members'); }} className="ml-auto font-bold whitespace-nowrap underline">সদস্য তালিকা</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Content Viewing Modals */}
                    {showExpenseList && (
                        <div className="fixed inset-0 z-50 flex flex-col justify-end bg-gray-900/40 backdrop-blur-sm transition-all p-4">
                            <div className="bg-white w-full max-w-md mx-auto rounded-3xl max-h-[85vh] flex flex-col shadow-2xl animate-slide-up">
                                <div className="flex justify-between items-center p-6 border-b border-gray-100">
                                    <h2 className="text-xl font-bold text-gray-900">সংগঠনের সকল খরচ</h2>
                                    <button onClick={() => setShowExpenseList(false)} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="p-6 overflow-y-auto space-y-3 flex-1 no-scrollbar">
                                    {expensesData.length > 0 ? expensesData.map((exp, idx) => (
                                        <div key={idx} className="bg-gray-50 p-4 rounded-xl flex justify-between items-center border border-gray-100">
                                            <div>
                                                <p className="font-semibold text-gray-800">{exp.purpose}</p>
                                                <p className="text-xs text-gray-500 mt-0.5"><i className="far fa-calendar-alt mr-1"></i>{exp.date}</p>
                                            </div>
                                            <p className="font-bold text-red-500">- ৳{exp.amount}</p>
                                        </div>
                                    )) : (
                                        <div className="text-center text-gray-500 py-10">
                                            <i className="fas fa-receipt text-4xl mb-3 opacity-30"></i>
                                            <p>কোনো খরচের রেকর্ড নেই</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {showEvents && (
                        <div className="fixed inset-0 z-50 flex flex-col justify-end bg-gray-900/40 backdrop-blur-sm transition-all p-4">
                            <div className="bg-white w-full max-w-md mx-auto rounded-3xl max-h-[85vh] flex flex-col shadow-2xl animate-slide-up">
                                <div className="flex justify-between items-center p-6 border-b border-gray-100">
                                    <h2 className="text-xl font-bold text-gray-900">আমাদের কার্যক্রম</h2>
                                    <button onClick={() => setShowEvents(false)} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="p-6 overflow-y-auto space-y-3 flex-1 no-scrollbar">
                                    {eventsData.length > 0 ? eventsData.map((ev, idx) => (
                                        <div key={idx} className="bg-gray-50 rounded-xl border border-gray-100 overflow-hidden">
                                            <div
                                                onClick={() => setExpandedEventId(expandedEventId === idx ? null : idx)}
                                                className="p-4 flex justify-between items-center cursor-pointer"
                                            >
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-9 h-9 rounded-full ${currentTheme.bgLight} ${currentTheme.accent} flex-shrink-0 flex items-center justify-center`}>
                                                        <i className="fas fa-bullseye text-sm"></i>
                                                    </div>
                                                    <div>
                                                        <p className="font-semibold text-gray-800">{ev.name}</p>
                                                        {ev.date && <p className="text-xs text-gray-500 mt-0.5"><i className="far fa-calendar-alt mr-1"></i>{ev.date}</p>}
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    {eventDonationInfo(ev).total > 0 && (
                                                        <span className="text-[11px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full"><i className="fas fa-hand-holding-heart mr-1"></i>৳{eventDonationInfo(ev).total.toLocaleString()}</span>
                                                    )}
                                                    {eventExpenseInfo(ev).total > 0 && (
                                                        <span className="text-[11px] font-bold text-red-600 bg-red-100 px-2 py-0.5 rounded-full"><i className="fas fa-receipt mr-1"></i>৳{eventExpenseInfo(ev).total.toLocaleString()}</span>
                                                    )}
                                                    <i className={`fas fa-chevron-down text-xs text-gray-400 transition-transform ${expandedEventId === idx ? 'rotate-180' : ''}`}></i>
                                                </div>
                                            </div>
                                            {expandedEventId === idx && (
                                                <div className="px-4 pb-4 pt-1 border-t border-gray-100">
                                                    {ev.details && <p className="text-sm text-gray-600 leading-relaxed whitespace-pre-wrap mb-3">{ev.details}</p>}
                                                    <div className="bg-emerald-50 rounded-lg px-3 py-2 mb-3">
                                                        <div className="flex justify-between items-center">
                                                            <span className="text-xs font-semibold text-emerald-700"><i className="fas fa-hand-holding-heart mr-1"></i>ডোনেশন জমা ({eventDonationInfo(ev).count} জন)</span>
                                                            <span className="font-bold text-emerald-700">+ ৳{eventDonationInfo(ev).total.toLocaleString()}</span>
                                                        </div>
                                                        {eventDonationInfo(ev).donors.length > 0 && (
                                                            <div className="mt-2 pt-2 border-t border-emerald-100 space-y-1.5">
                                                                {eventDonationInfo(ev).donors.map((dn, k) => (
                                                                    <div key={k} className="flex justify-between items-start gap-3 text-xs text-emerald-700">
                                                                        <span className="min-w-0">
                                                                            <i className="fas fa-user mr-1 opacity-70"></i>{dn.name}
                                                                            {dn.times > 1 ? <span className="text-emerald-500"> ({dn.times} বার)</span> : (dn.date ? <span className="text-emerald-500"> · {dn.date}</span> : null)}
                                                                        </span>
                                                                        <span className="font-semibold whitespace-nowrap">+ ৳{dn.total.toLocaleString()}</span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div className="bg-red-50 rounded-lg px-3 py-2 mb-3">
                                                        <div className="flex justify-between items-center">
                                                            <span className="text-xs font-semibold text-red-600"><i className="fas fa-receipt mr-1"></i>প্রোগ্রাম খরচ ({eventExpenseInfo(ev).count} টি)</span>
                                                            <span className="font-bold text-red-600">- ৳{eventExpenseInfo(ev).total.toLocaleString()}</span>
                                                        </div>
                                                        {eventExpenseInfo(ev).items.length > 0 && (
                                                            <div className="mt-2 pt-2 border-t border-red-100 space-y-1">
                                                                {eventExpenseInfo(ev).items.map((it, k) => (
                                                                    <div key={k} className="flex justify-between text-xs text-red-500">
                                                                        <span><i className="far fa-calendar-alt mr-1"></i>{it.date}</span>
                                                                        <span>- ৳{it.amount.toLocaleString()}</span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                    {/* এডিট/ডিলেট বাটন সবসময় দেখায়; কাজ করতে পিন লাগে (বাকি অ্যাডমিন বাটনের মতো) */}
                                                    <div className="flex gap-2">
                                                            <button
                                                                onClick={() => { setEditingEvent(ev); setEditTarget('edit_event'); setShowEditPinModal(true); }}
                                                                className="flex-1 py-2 rounded-lg bg-gray-100 text-gray-500 text-xs font-semibold hover:bg-blue-50 hover:text-blue-600 transition-colors flex items-center justify-center gap-2"
                                                            >
                                                                <i className="fas fa-pen"></i> প্রোগ্রাম এডিট
                                                            </button>
                                                            <button
                                                                onClick={() => { setDeleteEventTarget(ev); setEditTarget('delete_event'); setShowEditPinModal(true); }}
                                                                className="flex-1 py-2 rounded-lg bg-gray-100 text-gray-500 text-xs font-semibold hover:bg-red-50 hover:text-red-500 transition-colors flex items-center justify-center gap-2"
                                                            >
                                                                <i className="fas fa-trash-alt"></i> প্রোগ্রাম মুছুন
                                                            </button>
                                                        </div>
                                                </div>
                                            )}
                                        </div>
                                    )) : (
                                        <div className="text-center text-gray-500 py-10">
                                            <i className="fas fa-calendar-check text-4xl mb-3 opacity-30"></i>
                                            <p>এখনো কোনো প্রোগ্রাম যোগ করা হয়নি</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {showNotices && (
                        <div className="fixed inset-0 z-50 flex flex-col justify-end bg-gray-900/40 backdrop-blur-sm transition-all p-4">
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl rounded-b-3xl max-h-[80vh] flex flex-col shadow-2xl animate-slide-up">
                                <div className="flex justify-between items-center p-6 border-b border-gray-100">
                                    <h2 className="text-xl font-bold text-gray-900">নোটিশ বোর্ড</h2>
                                    <button onClick={() => setShowNotices(false)} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="p-6 overflow-y-auto no-scrollbar space-y-4 flex-1">
                                    {notices.length > 0 ? notices.map((notice, index) => (
                                        <div key={index} className="bg-[#f8f9fd] p-4 rounded-2xl border border-gray-100 flex gap-4">
                                            <div className={`w-10 h-10 rounded-full ${currentTheme.bgLight} ${currentTheme.accent} flex-shrink-0 flex items-center justify-center mt-1`}>
                                                <i className="fas fa-bell"></i>
                                            </div>
                                            <div>
                                                <h3 className="font-semibold text-gray-900">{notice.title}</h3>
                                                <p className="text-sm text-gray-600 mt-1 leading-relaxed">{notice.message}</p>
                                                <p className="text-xs text-gray-400 mt-2 font-medium"><i className="far fa-clock mr-1"></i>{notice.date}</p>
                                            </div>
                                        </div>
                                    )) : (
                                        <div className="text-center text-gray-500 py-10">
                                            <i className="far fa-bell-slash text-4xl mb-3 opacity-30"></i>
                                            <p>নতুন কোনো নোটিশ নেই</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {showAboutUs && (
                        <div className="fixed inset-0 z-50 flex flex-col justify-end bg-gray-900/40 backdrop-blur-sm transition-all p-4">
                            <div className="bg-white w-full max-w-md mx-auto rounded-3xl max-h-[85vh] flex flex-col shadow-2xl animate-slide-up">
                                <div className="flex justify-between items-center p-6 border-b border-gray-100">
                                    <h2 className="text-xl font-bold text-gray-900">About Us</h2>
                                    <button onClick={() => setShowAboutUs(false)} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="p-6 overflow-y-auto no-scrollbar">
                                    <div className="whitespace-pre-wrap text-sm text-gray-600 leading-relaxed">{aboutUsText || 'Loading...'}</div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showJoinForm && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm transition-opacity">
                            <div className="bg-white w-full max-w-sm rounded-[24px] overflow-hidden shadow-2xl animate-slide-up flex flex-col h-[85vh]">
                                <div className={`p-4 flex justify-between items-center ${currentTheme.primary} text-white`}>
                                    <h2 className="text-lg font-bold flex items-center gap-2"><i className="fas fa-user-plus"></i> সদস্যপদ আবেদন</h2>
                                    <button onClick={() => setShowJoinForm(false)} className="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center hover:bg-white/30 transition-colors">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="w-full flex-1 overflow-hidden bg-[#f0ebf8]">
                                    {GOOGLE_FORM_URL ? (
                                        <iframe 
                                            src={GOOGLE_FORM_URL.includes('?') ? GOOGLE_FORM_URL + '&embedded=true' : GOOGLE_FORM_URL + '?embedded=true'} 
                                            width="100%" 
                                            height="100%" 
                                            frameBorder="0" 
                                            marginHeight="0" 
                                            marginWidth="0" 
                                            className="w-full h-full border-none bg-transparent">
                                            লোড হচ্ছে...
                                        </iframe>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center h-full text-center p-8 text-gray-500">
                                            <p className="font-semibold text-gray-700">ফর্ম সেটআপ করা হয়নি</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Main Application Routes */}
                    <div className="h-full overflow-y-auto no-scrollbar">
                        {activeTab === 'members' && renderHeader('Directory')}
                        {activeTab === 'home' && renderHome()}
                        {activeTab === 'members' && renderMembers()}
                        {activeTab === 'donations' && renderDonations()}
                        {activeTab === 'profile' && renderProfile()}
                    </div>

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-gray-100 flex items-end justify-between px-3 pt-2 pb-2 pb-safe z-40 rounded-t-3xl shadow-[0_-4px_20px_rgba(0,0,0,0.03)]">
                        <button onClick={() => setActiveTab('home')} className={`flex-1 flex flex-col items-center gap-1 py-1 transition-colors ${activeTab === 'home' ? currentTheme.accent : 'text-gray-400 hover:text-gray-600'}`}>
                            <i className={`text-xl ${activeTab === 'home' ? 'fas' : 'far'} fa-home`}></i>
                            <span className="text-[10px] font-semibold">হোম</span>
                        </button>
                        <button onClick={() => setActiveTab('members')} className={`flex-1 flex flex-col items-center gap-1 py-1 transition-colors ${activeTab === 'members' || activeTab === 'profile' ? currentTheme.accent : 'text-gray-400 hover:text-gray-600'}`}>
                            <i className={`text-xl ${activeTab === 'members' || activeTab === 'profile' ? 'fas' : 'far'} fa-address-book`}></i>
                            <span className="text-[10px] font-semibold">সদস্য</span>
                        </button>
                        <div className="flex-1 flex justify-center">
                            <button onClick={() => setShowQuickAdd(true)} title="দ্রুত যোগ করুন" className={`-mt-8 w-14 h-14 rounded-full ${currentTheme.primary} text-white shadow-lg ring-4 ring-white flex items-center justify-center active:scale-90 transition-transform`}>
                                <i className="fas fa-plus text-xl"></i>
                            </button>
                        </div>
                        <button onClick={() => { setActiveTab('home'); setExpandedEventId(null); setShowEvents(true); }} className="flex-1 flex flex-col items-center gap-1 py-1 text-gray-400 hover:text-gray-600 transition-colors">
                            <i className="far fa-calendar-check text-xl"></i>
                            <span className="text-[10px] font-semibold">কার্যক্রম</span>
                        </button>
                        <button onClick={() => { fetchAllData(); showToast('ডেটা রিফ্রেশ করা হচ্ছে...', 'info'); }} className="flex-1 flex flex-col items-center gap-1 py-1 text-gray-400 hover:text-gray-600 transition-colors active:scale-90">
                            <i className={`text-xl fas fa-sync-alt ${syncStatus === 'Syncing...' ? `fa-spin ${currentTheme.accent}` : ''}`}></i>
                            <span className="text-[10px] font-semibold">রিফ্রেশ</span>
                        </button>
                    </nav>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<BondhanApp />);
    </script>
</body>
</html>
