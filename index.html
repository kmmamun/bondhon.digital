<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="বন্ধন - Home of Humanity Member Directory">
    
    <title>বন্ধন</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        html, body { 
            margin: 0; padding: 0; 
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #f8f9fd; 
            color: #111827;
        }
        .progress-circle { border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .progress-circle::before { content: ""; position: absolute; inset: 12px; background-color: white; border-radius: 50%; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.4s ease forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
            });
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const BondhanApp = () => {
            const [activeTab, setActiveTab] = useState('home'); 
            const [selectedMemberId, setSelectedMemberId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [membersData, setMembersData] = useState([]);
            const [notices, setNotices] = useState([]);
            const [showNotices, setShowNotices] = useState(false);
            const [showAboutUs, setShowAboutUs] = useState(false); 
            const [aboutUsText, setAboutUsText] = useState(''); 
            const [loading, setLoading] = useState(true);
            const [syncStatus, setSyncStatus] = useState('Syncing...');
            const [theme, setTheme] = useState(localStorage.getItem('bondhanTheme') || 'green');
            const [greeting, setGreeting] = useState('');
            
            const [isAuthorized, setIsAuthorized] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const SECRET_PIN = '1722'; 
            const [showJoinForm, setShowJoinForm] = useState(false);

            const GOOGLE_FORM_URL = 'https://forms.gle/2K9AST9ALqRqybho7';

            // সরাসরি গুগল শিট লিংক (CORS বাইপাসের জন্য অলটারনেটিভ বা পাবলিক লিংক)
            const MEMBERS_SHEET_URL = 'https://docs.google.com/spreadsheets/d/10oBrU9CXoTRI5olNxcii9BUwP-72PNSL/export?format=csv&gid=2103360002';
            const NOTICE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/10oBrU9CXoTRI5olNxcii9BUwP-72PNSL/export?format=csv&gid=1980828362';
            const ABOUT_US_SHEET_URL = 'https://docs.google.com/spreadsheets/d/10oBrU9CXoTRI5olNxcii9BUwP-72PNSL/export?format=csv&gid=1375885684';

            const themeStyles = {
                green: { name: 'Green (Brand)', primary: 'bg-emerald-600', hover: 'hover:bg-emerald-700', accent: 'text-emerald-600', bgLight: 'bg-emerald-50', border: 'border-emerald-100', hex: '#059669', gradient: 'from-emerald-600 to-green-400' },
                gray: { name: 'Gray (Roof)', primary: 'bg-slate-600', hover: 'hover:bg-slate-700', accent: 'text-slate-600', bgLight: 'bg-slate-100', border: 'border-slate-200', hex: '#475569', gradient: 'from-slate-600 to-gray-400' },
                red: { name: 'Red (Figure)', primary: 'bg-rose-600', hover: 'hover:bg-rose-700', accent: 'text-rose-600', bgLight: 'bg-rose-50', border: 'border-rose-100', hex: '#e11d48', gradient: 'from-rose-600 to-pink-500' },
                yellow: { name: 'Yellow (Figure)', primary: 'bg-amber-500', hover: 'hover:bg-amber-600', accent: 'text-amber-600', bgLight: 'bg-amber-50', border: 'border-amber-100', hex: '#f59e0b', gradient: 'from-amber-500 to-yellow-400' },
                purple: { name: 'Purple (Figure)', primary: 'bg-fuchsia-600', hover: 'hover:bg-fuchsia-700', accent: 'text-fuchsia-600', bgLight: 'bg-fuchsia-50', border: 'border-fuchsia-100', hex: '#c026d3', gradient: 'from-fuchsia-600 to-purple-400' }
            };

            const currentTheme = themeStyles[theme] || themeStyles.green;

            useEffect(() => { localStorage.setItem('bondhanTheme', theme); }, [theme]);

            useEffect(() => {
                const hour = new Date().getHours();
                if (hour >= 5 && hour < 12) setGreeting('শুভ সকাল 🌅');
                else if (hour >= 12 && hour < 17) setGreeting('শুভ অপরাহ্ন ☀️');
                else if (hour >= 17 && hour < 20) setGreeting('শুভ সন্ধ্যা 🌇');
                else setGreeting('শুভ রাত্রি 🌙');
            }, []);

            const handleAuthSubmit = () => {
                if (pinInput === SECRET_PIN) {
                    setIsAuthorized(true);
                    setShowAuthModal(false);
                    setPinInput('');
                } else {
                    alert('দুঃখিত, পিন কোডটি ভুল হয়েছে!');
                    setPinInput('');
                }
            };

            const fetchAboutUs = async () => {
                try {
                    const response = await fetch(ABOUT_US_SHEET_URL);
                    const csvText = await response.text();
                    const firstCommaIdx = csvText.indexOf(',');
                    if (firstCommaIdx !== -1) {
                        let text = csvText.substring(firstCommaIdx + 1).trim();
                        if (text.startsWith('"') && text.endsWith('"')) text = text.substring(1, text.length - 1);
                        text = text.replace(/""/g, '"');
                        setAboutUsText(text);
                    }
                } catch (error) { console.error('About Us fetch error:', error); }
            };

            const fetchNotices = async () => {
                try {
                    const response = await fetch(NOTICE_SHEET_URL);
                    const csvText = await response.text();
                    const lines = csvText.split('\n');
                    const noticesList = [];
                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;
                        const cells = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.trim().replace(/^"\vert{}"$/g, ''));
                        if (cells[1] || cells[2]) noticesList.push({ id: i, date: cells[0] || '', title: cells[1] || 'Notice', message: cells[2] || '', type: 'info' });
                    }
                    setNotices(noticesList);
                } catch (error) { console.error('Notice fetch error:', error); }
            };

            const fetchMembersFromSheets = async () => {
                try {
                    setSyncStatus('Syncing...');
                    const response = await fetch(MEMBERS_SHEET_URL);
                    const csvText = await response.text();
                    const lines = csvText.split('\n');
                    const members = [];

                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;
                        const cells = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.trim().replace(/^"\vert{}"$/g, ''));
                        
                        if (cells[0] && cells[0].startsWith('BPM')) {
                            const monthlySubscription = parseFloat(cells[15]) || 0; 
                            const paidAmounts = [
                                parseFloat(cells[16])||0, parseFloat(cells[17])||0, parseFloat(cells[18])||0, 
                                parseFloat(cells[19])||0, parseFloat(cells[20])||0, parseFloat(cells[21])||0, 
                                parseFloat(cells[22])||0, parseFloat(cells[23])||0, parseFloat(cells[24])||0, 
                                parseFloat(cells[25])||0, parseFloat(cells[26])||0, parseFloat(cells[27])||0  
                            ];

                            const totalYearly = paidAmounts.reduce((a, b) => a + b, 0); 
                            const expectedYearly = monthlySubscription * 12; 
                            const unpaid = Math.max(0, expectedYearly - totalYearly); 

                            members.push({
                                id: cells[0], name: cells[1] || '', fatherName: cells[2] || '', dob: cells[3] || '', blood: cells[4] || '', address: cells[5] || '', occupation: cells[7] || '', nid: cells[8] || '', mobile1: cells[9] || '', email: cells[11] || '', monthlySubscription, jan: cells[16] || '0', feb: cells[17] || '0', mar: cells[18] || '0', apr: cells[19] || '0', may: cells[20] || '0', jun: cells[21] || '0', jul: cells[22] || '0', aug: cells[23] || '0', sep: cells[24] || '0', oct: cells[25] || '0', nov: cells[26] || '0', dec: cells[27] || '0', totalYearly, unpaid, expectedYearly
                            });
                        }
                    }
                    setMembersData(members);
                    setSyncStatus('Updated');
                    setLoading(false);
                } catch (error) {
                    console.error('Error fetching members:', error);
                    setSyncStatus('Failed');
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchMembersFromSheets();
                fetchNotices();
                fetchAboutUs();
            }, []);

            const stats = useMemo(() => {
                let totalExpected = 0, totalCollected = 0;
                membersData.forEach(m => { totalExpected += m.expectedYearly; totalCollected += m.totalYearly; });
                const percentage = totalExpected > 0 ? Math.round((totalCollected / totalExpected) * 100) : 0;
                return { totalExpected, totalCollected, percentage };
            }, [membersData]);

            const filteredMembers = useMemo(() => {
                return membersData.filter(member =>
                    member.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    member.id.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    member.mobile1.includes(searchTerm)
                );
            }, [searchTerm, membersData]);

            const selectedMember = membersData.find(m => m.id === selectedMemberId);
            const months = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
            const monthLabels = ['জান', 'ফেব', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'অগাস্ট', 'সেপ্ট', 'অক্টো', 'নভেম', 'ডিসে'];

            const getMonthStatus = (member, month) => {
                const value = parseFloat(member[month]);
                if (!value || value === 0) return { status: 'unpaid', amount: null };
                return { status: 'paid', amount: value };
            };

            if (loading && membersData.length === 0) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-[#f8f9fd]">
                        <div className="animate-spin rounded-full h-12 w-12 border-4 border-gray-100 border-t-emerald-600 mb-4"></div>
                        <p className="text-gray-500 font-medium">Loading Data...</p>
                    </div>
                );
            }

            return (
                <div className="relative min-h-screen max-w-md mx-auto bg-[#f8f9fd] shadow-2xl overflow-hidden selection:bg-gray-200">
                    {activeTab !== 'profile' && (
                        <div className="bg-white sticky top-0 z-30 shadow-sm rounded-b-2xl mb-4">
                            <div className="flex items-center justify-between px-6 pt-5 pb-3">
                                <div className="flex items-center gap-3">
                                    <div className={`w-10 h-10 rounded-full bg-gradient-to-tr ${currentTheme.gradient} flex items-center justify-center text-white font-bold shadow-md`}>B</div>
                                    <h1 className="text-xl font-bold text-gray-900">{activeTab === 'home' ? 'Home' : 'Directory'}</h1>
                                </div>
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setShowNotices(true)} className="relative p-2 rounded-full text-gray-500 hover:bg-gray-100 transition">
                                        <i className="far fa-bell text-xl"></i>
                                        {notices.length > 0 && <span className="absolute top-1 right-1 w-3 h-3 bg-red-500 border-2 border-white rounded-full"></span>}
                                    </button>
                                </div>
                            </div>
                            <div className="px-6 pb-4 flex gap-3 justify-start">
                                {Object.keys(themeStyles).map(tKey => (
                                    <button key={tKey} onClick={() => setTheme(tKey)} className={`w-6 h-6 rounded-full transition-all duration-300 ${themeStyles[tKey].primary} ${theme === tKey ? 'scale-125 ring-2 ring-offset-2 ring-gray-300 shadow-md' : 'opacity-60 hover:opacity-100'}`} />
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Join Form Modal */}
                    {showJoinForm && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-sm rounded-[24px] overflow-hidden shadow-2xl flex flex-col h-[85vh]">
                                <div className={`p-4 flex justify-between items-center ${currentTheme.primary} text-white`}>
                                    <h2 className="text-lg font-bold flex items-center gap-2"><i className="fas fa-user-plus"></i> সদস্যপদ আবেদন</h2>
                                    <button onClick={() => setShowJoinForm(false)} className="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center"><i className="fas fa-times"></i></button>
                                </div>
                                <div className="w-full flex-1 overflow-hidden">
                                    <iframe src={GOOGLE_FORM_URL + '?embedded=true'} width="100%" height="100%" className="w-full h-full border-none">লোড হচ্ছে...</iframe>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Auth Modal */}
                    {showAuthModal && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-6 bg-gray-900/60 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-xs rounded-[24px] p-6 shadow-2xl text-center">
                                <div className={`w-16 h-16 rounded-full mx-auto mb-4 flex items-center justify-center text-2xl ${currentTheme.bgLight} ${currentTheme.accent}`}><i className="fas fa-lock"></i></div>
                                <h3 className="text-xl font-bold text-gray-900 mb-2">পিন কোড দিন</h3>
                                <input type="password" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="****" className={`w-full text-center text-3xl tracking-[0.5em] font-bold py-3 rounded-xl border-2 mb-6 ${currentTheme.border}`} autoFocus maxLength="4" />
                                <div className="flex gap-3">
                                    <button onClick={() => {setShowAuthModal(false); setPinInput('');}} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold">বাতিল</button>
                                    <button onClick={handleAuthSubmit} className={`flex-1 py-3 rounded-xl text-white font-bold ${currentTheme.primary}`}>আনলক</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Notice Modal */}
                    {showNotices && (
                        <div className="fixed inset-0 z-50 flex flex-col justify-end bg-gray-900/40 backdrop-blur-sm p-4">
                            <div className="bg-white w-full max-w-md mx-auto rounded-3xl max-h-[80vh] flex flex-col shadow-2xl">
                                <div className="flex justify-between items-center p-6 border-b border-gray-100">
                                    <h2 className="text-xl font-bold text-gray-900">Notifications</h2>
                                    <button onClick={() => setShowNotices(false)} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center"><i className="fas fa-times"></i></button>
                                </div>
                                <div className="p-6 overflow-y-auto space-y-4">
                                    {notices.map((notice) => (
                                        <div key={notice.id} className="bg-[#f8f9fd] p-4 rounded-2xl border border-gray-100 flex gap-4">
                                            <div>
                                                <h3 className="font-semibold text-gray-900">{notice.title}</h3>
                                                <p className="text-sm text-gray-600 mt-1">{notice.message}</p>
                                                <p className="text-xs text-gray-400 mt-2">{notice.date}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Main Content Area */}
                    <div className="h-full overflow-y-auto no-scrollbar pb-28">
                        {activeTab === 'home' && (
                            <div className="p-6 pt-2">
                                <h2 className="text-2xl font-bold text-gray-900">{greeting}</h2>
                                <p className={`font-medium mt-1 ${currentTheme.accent}`}>বন্ধন-এ আপনাকে স্বাগতম!</p>
                                
                                <div className="bg-white rounded-[24px] p-6 shadow-sm border border-gray-50 flex items-center justify-between my-6">
                                    <div>
                                        <div className="flex items-center gap-2 mb-1">
                                            <p className="text-gray-500 text-sm font-medium">Total Collected Fund</p>
                                            <button onClick={() => isAuthorized ? setIsAuthorized(false) : setShowAuthModal(true)} className={`w-6 h-6 rounded-full flex items-center justify-center ${isAuthorized ? 'bg-gray-100 text-gray-500' : currentTheme.bgLight + ' ' + currentTheme.accent}`}>
                                                <i className={`fas ${isAuthorized ? 'fa-unlock-alt' : 'fa-lock'} text-xs`}></i>
                                            </button>
                                        </div>
                                        <h2 className="text-3xl font-bold text-gray-900 mb-1">৳ {isAuthorized ? stats.totalCollected.toLocaleString() : '****'}</h2>
                                    </div>
                                    <div className="relative w-24 h-24 progress-circle" style={{ background: `conic-gradient(${currentTheme.hex} ${isAuthorized ? stats.percentage : 0}%, #e0e7ff 0deg)` }}>
                                        <div className="relative z-10 flex flex-col items-center">
                                            <span className="text-xl font-bold text-gray-800">{isAuthorized ? stats.percentage : '**'}%</span>
                                        </div>
                                    </div>
                                </div>

                                <div onClick={() => setShowAboutUs(true)} className="bg-white rounded-[20px] p-5 shadow-sm border border-gray-50 mb-4 cursor-pointer">
                                    <h4 className="font-semibold text-gray-800">About Us</h4>
                                    <p className="text-xs text-gray-400 mt-1">Bondhan Info</p>
                                </div>

                                <div onClick={() => setShowJoinForm(true)} className={`bg-gradient-to-r ${currentTheme.gradient} text-white rounded-[20px] p-4 flex items-center justify-between cursor-pointer shadow-md`}>
                                    <div>
                                        <h4 className="font-bold">সদস্য হতে চান?</h4>
                                        <p className="text-xs opacity-90">আবেদন করুন</p>
                                    </div>
                                    <i className="fas fa-chevron-right"></i>
                                </div>
                            </div>
                        )}

                        {activeTab === 'members' && (
                            <div className="p-6 pt-2">
                                <div className="relative mb-6">
                                    <i className="fas fa-search absolute left-4 top-4 text-gray-400"></i>
                                    <input type="text" placeholder="Search members, ID..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-11 pr-4 py-3.5 rounded-2xl bg-white border border-gray-100 focus:outline-none" />
                                </div>
                                <div className="space-y-3">
                                    {filteredMembers.map((member) => (
                                        <div key={member.id} onClick={() => { setSelectedMemberId(member.id); setActiveTab('profile'); }} className="bg-white p-4 rounded-[20px] shadow-sm border border-gray-50 flex items-center gap-4 cursor-pointer">
                                            <div className={`w-12 h-12 rounded-2xl ${currentTheme.bgLight} ${currentTheme.accent} flex items-center justify-center text-xl`}><i className="far fa-user"></i></div>
                                            <div className="flex-1">
                                                <h4 className="font-semibold text-gray-800">{member.name}</h4>
                                                <p className="text-xs text-gray-500">{member.id}</p>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-xs font-semibold">৳ {member.totalYearly}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'profile' && selectedMember && (
                            <div className="p-6">
                                <button onClick={() => setActiveTab('members')} className="mb-4 px-4 py-2 bg-gray-200 rounded-xl text-sm font-semibold"><i className="fas fa-arrow-left mr-2"></i> Back</button>
                                <div className="bg-white rounded-[24px] p-6 shadow-sm border border-gray-50 text-center mb-6">
                                    <h2 className="text-2xl font-bold text-gray-900">{selectedMember.name}</h2>
                                    <p className={`${currentTheme.accent} font-medium text-sm`}>{selectedMember.id}</p>
                                    <p className="text-gray-500 text-sm mt-1">{selectedMember.mobile1}</p>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-gray-100 flex justify-between px-12 py-3 z-40 rounded-t-3xl shadow-lg">
                        <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 ${activeTab === 'home' ? currentTheme.accent : 'text-gray-400'}`}>
                            <i className="text-xl fas fa-home"></i><span className="text-[10px]">Home</span>
                        </button>
                        <button onClick={() => setActiveTab('members')} className={`flex flex-col items-center gap-1 ${activeTab === 'members' || activeTab === 'profile' ? currentTheme.accent : 'text-gray-400'}`}>
                            <i className="text-xl fas fa-folder"></i><span className="text-[10px]">Directory</span>
                        </button>
                    </nav>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<BondhanApp />);
    </script>
</body>
</html>
