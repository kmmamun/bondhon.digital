<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="বন্ধন - Home of Humanity Member Directory">
    
    <title>বন্ধন - Home of Humanity</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * { 
            box-sizing: border-box; 
        }
        
        html, body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: #f8f9fd; 
            color: #111827; 
        }

        .progress-circle { 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .progress-circle::before { 
            content: ""; 
            position: absolute; 
            inset: 12px; 
            background-color: white; 
            border-radius: 50%; 
        }

        .no-scrollbar::-webkit-scrollbar { 
            display: none; 
        }

        .no-scrollbar { 
            -ms-overflow-style: none; 
            scrollbar-width: none; 
        }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .animate-slide-up { 
            animation: slideUp 0.4s ease forwards; 
        }

        @keyframes toastSlideIn { 
            from { transform: translateY(-100%); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }

        @keyframes toastSlideOut { 
            from { transform: translateY(0); opacity: 1; } 
            to { transform: translateY(-100%); opacity: 0; } 
        }

        .toast-enter { 
            animation: toastSlideIn 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .toast-exit { 
            animation: toastSlideOut 0.3s forwards; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        if ('serviceWorker' in navigator) {
            const hadController = !!navigator.serviceWorker.controller;
            let reloaded = false;
            // নতুন sw.js চালু হলে একবার অটো-রিলোড (যাতে পুরোনো ক্যাশ না থাকে)
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!hadController || reloaded) return;
                reloaded = true;
                window.location.reload();
            });
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js?v=12').then(reg => reg.update()).catch(() => {}); // Cache buster updated
            });
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-500' : 'bg-gray-800';
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
            
            return (
                <div className="fixed top-4 left-0 right-0 z-[100] flex justify-center px-4 pointer-events-none">
                    <div className={`${bgColor} text-white px-5 py-3 rounded-2xl shadow-lg flex items-center gap-3 toast-enter max-w-sm w-full`}>
                        <i className={`fas ${icon} text-lg`}></i>
                        <span className="font-semibold text-sm">{message}</span>
                    </div>
                </div>
            );
        };

        const BondhanApp = () => {
            // Navigation States
            const [activeTab, setActiveTab] = useState('home'); 
            const [selectedMemberId, setSelectedMemberId] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            
            // Data States
            const [membersData, setMembersData] = useState([]);
            const [expensesData, setExpensesData] = useState([]);
            const [notices, setNotices] = useState([]);
            const [aboutUsText, setAboutUsText] = useState(''); 
            
            // Modal States
            const [showNotices, setShowNotices] = useState(false);
            const [showExpenseList, setShowExpenseList] = useState(false);
            const [showAboutUs, setShowAboutUs] = useState(false); 
            const [showJoinForm, setShowJoinForm] = useState(false);
            
            // UI States
            const [loading, setLoading] = useState(true);
            const [syncStatus, setSyncStatus] = useState('Syncing...');
            const [theme, setTheme] = useState(localStorage.getItem('bondhanTheme') || 'green');
            const [greeting, setGreeting] = useState('');
            const [toast, setToast] = useState(null); 
            
            // Authorization States
            const [isAuthorized, setIsAuthorized] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [pinInput, setPinInput] = useState('');
            const SECRET_PIN = '1722'; 
            
            // Edit & Form Features
            const [showEditPinModal, setShowEditPinModal] = useState(false);
            const [editTarget, setEditTarget] = useState(null); 
            const [showProfileEditForm, setShowProfileEditForm] = useState(false);
            const [showPaymentEditForm, setShowPaymentEditForm] = useState(false);
            const [showDonationEditForm, setShowDonationEditForm] = useState(false);
            const [showAddNoticeForm, setShowAddNoticeForm] = useState(false);
            const [showAddExpenseForm, setShowAddExpenseForm] = useState(false);
            
            // Input States for Forms
            const [editPinInput, setEditPinInput] = useState('');
            const [editData, setEditData] = useState({});
            const [paymentData, setPaymentData] = useState({ month: '', amount: '' });
            const [donationData, setDonationData] = useState({ amount: '' });
            const [newNoticeData, setNewNoticeData] = useState({ title: '', message: '' });
            const [newExpenseData, setNewExpenseData] = useState({ purpose: '', amount: '' });
            
            const [isUpdating, setIsUpdating] = useState(false);
            
            // =========================================================================
            // লিংক কনফিগারেশন 
            // =========================================================================
            const GOOGLE_FORM_URL = 'https://forms.gle/2K9AST9ALqRqybho7';
            const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwiiAiB3SfB0xtw36fobz41Ce8R16BGNkFo9As7ocRUh0MORzP26s5mM0b8u0xmbdny/exec';

            // সব ট্যাব এখন একই ফাইল থেকে (2026 Bondhon Member Directory-Updated)
            const MEMBERS_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1q-TZj3ur3FtPMB1Z2Ppq9tG8DUAyRhLObzxo4PEVlFs/export?format=csv&gid=2103360002';
            const NOTICE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1q-TZj3ur3FtPMB1Z2Ppq9tG8DUAyRhLObzxo4PEVlFs/export?format=csv&gid=1980828362';
            const ABOUT_US_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1q-TZj3ur3FtPMB1Z2Ppq9tG8DUAyRhLObzxo4PEVlFs/export?format=csv&gid=1375885684';
            const EXPENSE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1q-TZj3ur3FtPMB1Z2Ppq9tG8DUAyRhLObzxo4PEVlFs/export?format=csv&gid=429716275'; 
            // =========================================================================

            const themeStyles = {
                green: { 
                    name: 'Green (Brand)', primary: 'bg-emerald-600', hover: 'hover:bg-emerald-700', 
                    accent: 'text-emerald-600', bgLight: 'bg-emerald-50', border: 'border-emerald-100', 
                    hex: '#059669', gradient: 'from-emerald-600 to-green-400' 
                },
                gray: { 
                    name: 'Gray (Roof)', primary: 'bg-slate-600', hover: 'hover:bg-slate-700', 
                    accent: 'text-slate-600', bgLight: 'bg-slate-100', border: 'border-slate-200', 
                    hex: '#475569', gradient: 'from-slate-600 to-gray-400' 
                },
                red: { 
                    name: 'Red (Figure)', primary: 'bg-rose-600', hover: 'hover:bg-rose-700', 
                    accent: 'text-rose-600', bgLight: 'bg-rose-50', border: 'border-rose-100', 
                    hex: '#e11d48', gradient: 'from-rose-600 to-pink-500' 
                },
                yellow: { 
                    name: 'Yellow (Figure)', primary: 'bg-amber-500', hover: 'hover:bg-amber-600', 
                    accent: 'text-amber-600', bgLight: 'bg-amber-50', border: 'border-amber-100', 
                    hex: '#f59e0b', gradient: 'from-amber-500 to-yellow-400' 
                },
                purple: { 
                    name: 'Purple (Figure)', primary: 'bg-fuchsia-600', hover: 'hover:bg-fuchsia-700', 
                    accent: 'text-fuchsia-600', bgLight: 'bg-fuchsia-50', border: 'border-fuchsia-100', 
                    hex: '#c026d3', gradient: 'from-fuchsia-600 to-purple-400' 
                }
            };

            const currentTheme = themeStyles[theme] || themeStyles.green;

            useEffect(() => { 
                localStorage.setItem('bondhanTheme', theme); 
            }, [theme]);

            useEffect(() => {
                const hour = new Date().getHours();
                if (hour >= 5 && hour < 12) setGreeting('শুভ সকাল 🌅');
                else if (hour >= 12 && hour < 17) setGreeting('শুভ অপরাহ্ন ☀️');
                else if (hour >= 17 && hour < 20) setGreeting('শুভ সন্ধ্যা 🌇');
                else setGreeting('শুভ রাত্রি 🌙');
                
                fetchAllData();
            }, []);

            // অ্যাপ আবার ওপেন/ফোকাস হলে, নেট ফিরলে এবং প্রতি ২ মিনিটে অটো-রিফ্রেশ
            useEffect(() => {
                const refresh = () => fetchAllData(true);
                const onVisible = () => { if (document.visibilityState === 'visible') refresh(); };
                document.addEventListener('visibilitychange', onVisible);
                window.addEventListener('online', refresh);
                const timer = setInterval(() => {
                    if (document.visibilityState === 'visible') refresh();
                }, 120000);
                return () => {
                    document.removeEventListener('visibilitychange', onVisible);
                    window.removeEventListener('online', refresh);
                    clearInterval(timer);
                };
            }, []);

            const showToast = (message, type = 'success') => setToast({ message, type });

            const fetchAllData = (silent = false) => {
                fetchMembersFromSheets(silent === true);
                fetchNotices();
                fetchAboutUs();
                fetchExpenses();
            };

            const isValidCSV = (text) => {
                return !text.includes('<!DOCTYPE html>') && !text.includes('<script>');
            };

            // সঠিক CSV পার্সার: কোটের ভেতরের কমা, নতুন লাইন (Enter) ও \r\n সব হ্যান্ডেল করে
            const parseCSV = (text) => {
                const rows = [];
                let row = [];
                let cell = '';
                let inQuotes = false;
                if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

                for (let i = 0; i < text.length; i++) {
                    const ch = text[i];
                    if (inQuotes) {
                        if (ch === '"') {
                            if (text[i + 1] === '"') { cell += '"'; i++; }
                            else inQuotes = false;
                        } else {
                            cell += ch;
                        }
                    } else if (ch === '"') {
                        inQuotes = true;
                    } else if (ch === ',') {
                        row.push(cell.trim());
                        cell = '';
                    } else if (ch === '\n' || ch === '\r') {
                        if (ch === '\r' && text[i + 1] === '\n') i++;
                        row.push(cell.trim());
                        cell = '';
                        if (row.some(c => c !== '')) rows.push(row);
                        row = [];
                    } else {
                        cell += ch;
                    }
                }
                row.push(cell.trim());
                if (row.some(c => c !== '')) rows.push(row);
                return rows;
            };

            const fetchExpenses = async () => {
                try {
                    const response = await fetch(`${EXPENSE_SHEET_URL}&t=${new Date().getTime()}`, { cache: 'no-store' });
                    if(!response.ok) return;
                    
                    const csvText = await response.text();
                    if(!isValidCSV(csvText)) return;
                    
                    const rows = parseCSV(csvText);
                    const expList = [];
                    
                    for (let i = 1; i < rows.length; i++) {
                        const cells = rows[i];
                        if(cells[1]) {
                            expList.push({ 
                                date: cells[0], 
                                purpose: cells[1], 
                                amount: parseFloat(cells[2]) || 0 
                            });
                        }
                    }
                    setExpensesData(expList.reverse());
                } catch (error) { 
                    console.error('Expense fetch error:', error); 
                }
            };

            const fetchAboutUs = async () => { 
                try {
                    const response = await fetch(`${ABOUT_US_SHEET_URL}&t=${new Date().getTime()}`, { cache: 'no-store' });
                    const csvText = await response.text();
                    
                    if(!isValidCSV(csvText)) {
                        setAboutUsText("ডেটা লোড করা যাচ্ছে না। গুগল শিটটি 'Public' করা আছে কিনা চেক করুন।");
                        return;
                    }
                    
                    const firstCommaIdx = csvText.indexOf(',');
                    if (firstCommaIdx !== -1) {
                        let text = csvText.substring(firstCommaIdx + 1).trim();
                        if (text.startsWith('"') && text.endsWith('"')) {
                            text = text.substring(1, text.length - 1);
                        }
                        setAboutUsText(text.replace(/""/g, '"'));
                    }
                } catch (error) {}
            };

            const fetchNotices = async () => { 
                try {
                    const response = await fetch(`${NOTICE_SHEET_URL}&t=${new Date().getTime()}`, { cache: 'no-store' });
                    const csvText = await response.text();
                    if(!isValidCSV(csvText)) return;
                    
                    const rows = parseCSV(csvText);
                    const noticesList = [];
                    
                    for (let i = 1; i < rows.length; i++) {
                        const cells = rows[i];
                        
                        if (cells.length < 10 && (cells[1] || cells[2]) && !cells[0].startsWith('BPM')) {
                            noticesList.push({ 
                                id: i, 
                                date: cells[0] || '', 
                                title: cells[1] || 'Notice', 
                                message: cells[2] || '', 
                                type: 'info' 
                            });
                        }
                    }
                    setNotices(noticesList.reverse());
                } catch (error) {}
            };

            const fetchMembersFromSheets = async (silent = false) => {
                try {
                    setSyncStatus('Syncing...');
                    const response = await fetch(`${MEMBERS_SHEET_URL}&t=${new Date().getTime()}`, { cache: 'no-store' });
                    const csvText = await response.text();
                    
                    if(!isValidCSV(csvText)) {
                        setLoading(false); 
                        setSyncStatus('Failed');
                        if (!silent) alert("Error: গুগল শিটটি 'Public' করা নেই! দয়া করে শিটের Share সেটিংসে গিয়ে 'Anyone with the link' করুন।");
                        return;
                    }

                    const rows = parseCSV(csvText);
                    const members = [];

                    for (let i = 1; i < rows.length; i++) {
                        const cells = rows[i];
                        
                        if (cells[0] && (/^BPM/i.test(cells[0]) || (/\d/.test(cells[0]) && cells[2]))) {
                            const monthlySubscription = parseFloat(cells[16]) || 0; 
                            const paidAmounts = [
                                parseFloat(cells[17]) || 0, 
                                parseFloat(cells[18]) || 0, 
                                parseFloat(cells[19]) || 0, 
                                parseFloat(cells[20]) || 0, 
                                parseFloat(cells[21]) || 0, 
                                parseFloat(cells[22]) || 0, 
                                parseFloat(cells[23]) || 0, 
                                parseFloat(cells[24]) || 0, 
                                parseFloat(cells[25]) || 0, 
                                parseFloat(cells[26]) || 0, 
                                parseFloat(cells[27]) || 0, 
                                parseFloat(cells[28]) || 0
                            ];
                            
                            const monthlyPaidTotal = paidAmounts.reduce((a, b) => a + b, 0); 
                            const expectedYearly = monthlySubscription * 12; 
                            const donation = parseFloat(cells[29]) || 0;
                            const totalYearly = monthlyPaidTotal + donation; 

                            members.push({
                                id: cells[0], 
                                status: cells[1] || '', 
                                name: cells[2] || '', 
                                fatherName: cells[3] || '', 
                                dob: cells[4] || '', 
                                blood: cells[5] || '', 
                                address: cells[6] || '', 
                                occupation: cells[8] || '', 
                                nid: cells[9] || '', 
                                mobile1: cells[10] || '', 
                                email: cells[12] || '', 
                                monthlySubscription, 
                                jan: cells[17] || '0', 
                                feb: cells[18] || '0', 
                                mar: cells[19] || '0', 
                                apr: cells[20] || '0', 
                                may: cells[21] || '0', 
                                jun: cells[22] || '0', 
                                jul: cells[23] || '0', 
                                aug: cells[24] || '0', 
                                sep: cells[25] || '0', 
                                oct: cells[26] || '0', 
                                nov: cells[27] || '0', 
                                dec: cells[28] || '0', 
                                monthlyPaidTotal, 
                                donation, 
                                totalYearly, 
                                expectedYearly, 
                                unpaid: Math.max(0, expectedYearly - monthlyPaidTotal)
                            });
                        }
                    }
                    
                    setMembersData(members);
                    
                    setSelectedMemberId(prev => (prev && !members.find(m => m.id === prev)) ? null : prev);
                    
                    setSyncStatus('Updated'); 
                    setLoading(false);
                } catch (error) { 
                    setLoading(false); 
                    setSyncStatus('Failed'); 
                }
            };

            const stats = useMemo(() => {
                let totalExpected = 0; 
                let totalIncome = 0; 
                let totalExpenseAmt = 0;
                
                membersData.forEach(m => { 
                    totalExpected += m.expectedYearly; 
                    totalIncome += m.totalYearly; 
                });
                
                expensesData.forEach(e => { 
                    totalExpenseAmt += e.amount; 
                });
                
                const currentBalance = totalIncome - totalExpenseAmt;
                const percentage = totalExpected > 0 ? Math.round((totalIncome / totalExpected) * 100) : 0;
                
                return { 
                    totalExpected, 
                    totalIncome, 
                    totalExpenseAmt, 
                    currentBalance, 
                    percentage 
                };
            }, [membersData, expensesData]);

            const filteredMembers = useMemo(() => {
                return membersData.filter(member => 
                    member.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    member.id.toLowerCase().includes(searchTerm.toLowerCase()) || 
                    member.mobile1.includes(searchTerm)
                );
            }, [searchTerm, membersData]);

            const selectedMember = membersData.find(m => m.id === selectedMemberId);

            const months = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
            const monthLabels = ['জান', 'ফেব', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'অগাস্ট', 'সেপ্ট', 'অক্টো', 'নভেম', 'ডিসে'];

            const getMonthStatus = (member, month) => {
                const value = parseFloat(member[month]);
                if (!value || value === 0) {
                    return { status: 'unpaid', amount: null };
                }
                return { status: 'paid', amount: value };
            };

            const handleAuthSubmit = () => {
                if (pinInput === SECRET_PIN) {
                    setIsAuthorized(true); 
                    setShowAuthModal(false); 
                    setPinInput('');
                    showToast('সফলভাবে আনলক করা হয়েছে');
                } else { 
                    showToast('দুঃখিত, পিন কোডটি ভুল হয়েছে!', 'error'); 
                    setPinInput(''); 
                }
            };

            const handleEditPinSubmit = () => {
                if (editPinInput === SECRET_PIN) {
                    setShowEditPinModal(false); 
                    setEditPinInput('');
                    
                    if(editTarget === 'add_notice') {
                        setNewNoticeData({ title: '', message: '' }); 
                        setShowAddNoticeForm(true);
                    } else if (editTarget === 'add_expense') {
                        setNewExpenseData({ purpose: '', amount: '' }); 
                        setShowAddExpenseForm(true);
                    } else {
                        const sm = membersData.find(m => m.id === selectedMemberId);
                        if(sm) {
                            if (editTarget === 'profile') {
                                setEditData({ id: sm.id, name: sm.name, status: sm.status, mobile1: sm.mobile1 }); 
                                setShowProfileEditForm(true);
                            } else if (editTarget === 'payment') {
                                setPaymentData({ id: sm.id, month: 'jan', amount: '' }); 
                                setShowPaymentEditForm(true);
                            } else if (editTarget === 'donation') {
                                setDonationData({ id: sm.id, amount: sm.donation || '' }); 
                                setShowDonationEditForm(true);
                            }
                        }
                    }
                } else { 
                    showToast('পিন কোড ভুল হয়েছে!', 'error'); 
                    setEditPinInput(''); 
                }
            };

            const performUpdate = async (payload, successMsg) => {
                setIsUpdating(true);
                try {
                    const res = await fetch(APPS_SCRIPT_URL, { 
                        method: 'POST', 
                        body: JSON.stringify(payload), 
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                    });
                    const result = await res.json();
                    
                    if(result.status === 'success') {
                        showToast(successMsg);
                        setShowProfileEditForm(false); 
                        setShowPaymentEditForm(false); 
                        setShowDonationEditForm(false); 
                        setShowAddNoticeForm(false); 
                        setShowAddExpenseForm(false);
                        
                        setTimeout(fetchAllData, 3000); 
                    } else { 
                        showToast('আপডেট ব্যর্থ: ' + result.message, 'error'); 
                    }
                } catch (e) { 
                    showToast('নেটওয়ার্ক সমস্যা! ইন্টারনেট সংযোগ পরীক্ষা করুন।', 'error'); 
                }
                setIsUpdating(false);
            };

            if (loading && membersData.length === 0) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen bg-[#f8f9fd]">
                        <div className={`animate-spin rounded-full h-12 w-12 border-4 border-gray-100 border-t-${currentTheme.hex} mb-4`} style={{ borderTopColor: currentTheme.hex }}></div>
                        <p className="text-gray-500 font-medium">Loading Data...</p>
                    </div>
                );
            }

            const renderHeader = (title) => (
                <div className="bg-white sticky top-0 z-30 shadow-sm rounded-b-2xl mb-4">
                    <div className="flex items-center justify-between px-6 pt-5 pb-3">
                        <div className="flex items-center gap-3">
                            <div className={`w-10 h-10 rounded-full bg-gradient-to-tr ${currentTheme.gradient} flex items-center justify-center text-white font-bold shadow-md`}>
                                B
                            </div>
                            <h1 className="text-xl font-bold text-gray-900">{title}</h1>

                                    </div>
                                </div>
                                <div className="flex gap-3 mt-8">
                                    <button onClick={() => setShowProfileEditForm(false)} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200 transition-colors">বাতিল</button>
                                    <button onClick={() => performUpdate({...editData, updateType: 'profile'}, 'প্রোফাইল ডেটা আপডেট হয়েছে!')} disabled={isUpdating} className={`flex-1 py-3 rounded-xl text-white font-bold flex justify-center items-center transition-colors ${currentTheme.primary} ${currentTheme.hover} ${isUpdating ? 'opacity-70 cursor-not-allowed' : ''}`}>
                                        {isUpdating ? <i className="fas fa-spinner fa-spin"></i> : 'সেভ করুন'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showPaymentEditForm && (
                        <div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm transition-opacity">
                            <div className="bg-white w-full max-w-sm rounded-[24px] p-6 shadow-2xl animate-slide-up">
                                <h2 className="text-lg font-bold text-gray-900 mb-4 border-b border-gray-100 pb-3 flex items-center gap-2">
                                    <i className={`fas fa-calendar-alt ${currentTheme.accent}`}></i> চাঁদা আপডেট: {paymentData.id}
                                </h2>
                                <div className="space-y-4 text-left">
                                    <div>
                                        <label className="text-xs font-semibold text-gray-500 mb-1 block">মাস নির্বাচন করুন</label>
                                        <select value={paymentData.month} onChange={(e) => setPaymentData({...paymentData, month: e.target.value})} className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition-colors">
                                            {months.map((m, i) => <option key={m} value={m}>{monthLabels[i]}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-gray-500 mb-1 block">চাঁদার পরিমাণ (৳)</label>
                                        <input type="number" value={paymentData.amount} onChange={(e) => setPaymentData({...paymentData, amount: e.target.value})} placeholder="যেমন: ২০০" className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition-colors" />
                                    </div>
                                </div>
                                <div className="flex gap-3 mt-8">
                                    <button onClick={() => setShowPaymentEditForm(false)} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200 transition-colors">বাতিল</button>
                                    <button onClick={() => performUpdate({...paymentData, updateType: 'payment'}, 'মাসিক চাঁদা আপডেট হয়েছে!')} disabled={isUpdating} className={`flex-1 py-3 rounded-xl text-white font-bold flex justify-center items-center transition-colors ${currentTheme.primary} ${currentTheme.hover} ${isUpdating ? 'opacity-70 cursor-not-allowed' : ''}`}>
                                        {isUpdating ? <i className="fas fa-spinner fa-spin"></i> : 'সেভ করুন'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showDonationEditForm && (
                        <div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm transition-opacity">
                            <div className="bg-white w-full max-w-sm rounded-[24px] p-6 shadow-2xl animate-slide-up">
                                <h2 className="text-lg font-bold text-gray-900 mb-4 border-b border-gray-100 pb-3 flex items-center gap-2">
                                    <i className={`fas fa-hand-holding-heart ${currentTheme.accent}`}></i> ডোনেশন আপডেট: {donationData.id}
                                </h2>
                                <div className="space-y-4 text-left">
                                    <div>
                                        <label className="text-xs font-semibold text-gray-500 mb-1 block">ডোনেশনের পরিমাণ (৳)</label>
                                        <input type="number" value={donationData.amount} onChange={(e) => setDonationData({...donationData, amount: e.target.value})} placeholder="যেমন: ৫০০" className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition-colors" />
                                    </div>
                                </div>
                                <div className="flex gap-3 mt-8">
                                    <button onClick={() => setShowDonationEditForm(false)} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200 transition-colors">বাতিল</button>
                                    <button onClick={() => performUpdate({...donationData, updateType: 'donation'}, 'ডোনেশন সফলভাবে আপডেট হয়েছে!')} disabled={isUpdating} className={`flex-1 py-3 rounded-xl text-white font-bold flex justify-center items-center transition-colors ${currentTheme.primary} ${currentTheme.hover} ${isUpdating ? 'opacity-70 cursor-not-allowed' : ''}`}>
                                        {isUpdating ? <i className="fas fa-spinner fa-spin"></i> : 'সেভ করুন'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showAddNoticeForm && (
                        <div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm transition-opacity">
                            <div className="bg-white w-full max-w-sm rounded-[24px] p-6 shadow-2xl animate-slide-up">
                                <h2 className="text-lg font-bold text-gray-900 mb-4 border-b border-gray-100 pb-3 flex items-center gap-2">
                                    <i className={`fas fa-bullhorn ${currentTheme.accent}`}></i> নতুন নোটিশ তৈরি
                                </h2>
                                <div className="space-y-4 text-left">
                                    <div>
                                        <label className="text-xs font-semibold text-gray-500 mb-1 block">শিরোনাম (Topic)</label>
                                        <input type="text" value={newNoticeData.title} onChange={(e) => setNewNoticeData({...newNoticeData, title: e.target.value})} placeholder="যেমন: আগামী মিটিং..." className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition-colors" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-gray-500 mb-1 block">বিস্তারিত (Details)</label>
                                        <textarea rows="4" value={newNoticeData.message} onChange={(e) => setNewNoticeData({...newNoticeData, message: e.target.value})} placeholder="নোটিশের সম্পূর্ণ বিবরণ লিখুন..." className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition-colors"></textarea>
                                    </div>
                                </div>
                                <div className="flex gap-3 mt-8">
                                    <button onClick={() => setShowAddNoticeForm(false)} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200 transition-colors">বাতিল</button>
                                    <button onClick={() => performUpdate({...newNoticeData, updateType: 'add_notice'}, 'নতুন নোটিশ পাবলিশ করা হয়েছে!')} disabled={isUpdating} className={`flex-1 py-3 rounded-xl text-white font-bold flex justify-center items-center transition-colors ${currentTheme.primary} ${currentTheme.hover} ${isUpdating ? 'opacity-70 cursor-not-allowed' : ''}`}>
                                        {isUpdating ? <i className="fas fa-spinner fa-spin"></i> : 'পাবলিশ করুন'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showAddExpenseForm && (
                        <div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm transition-opacity">
                            <div className="bg-white w-full max-w-sm rounded-[24px] p-6 shadow-2xl animate-slide-up">
                                <h2 className="text-lg font-bold text-gray-900 mb-4 border-b border-gray-100 pb-3 flex items-center gap-2">
                                    <i className="fas fa-minus-circle text-red-500"></i> নতুন খরচ যোগ করুন
                                </h2>
                                <div className="space-y-4 text-left">
                                    <div>
                                        <label className="text-xs font-semibold text-gray-500 mb-1 block">খরচের খাত (Purpose)</label>
                                        <input type="text" value={newExpenseData.purpose} onChange={(e) => setNewExpenseData({...newExpenseData, purpose: e.target.value})} placeholder="যেমন: ব্যানার প্রিন্ট, আপ্যায়ন..." className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition-colors" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-gray-500 mb-1 block">টাকার পরিমাণ (৳)</label>
                                        <input type="number" value={newExpenseData.amount} onChange={(e) => setNewExpenseData({...newExpenseData, amount: e.target.value})} placeholder="যেমন: ৫০০" className="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-emerald-500 focus:bg-white transition-colors" />
                                    </div>
                                </div>
                                <div className="flex gap-3 mt-8">
                                    <button onClick={() => setShowAddExpenseForm(false)} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200 transition-colors">বাতিল</button>
                                    <button onClick={() => performUpdate({...newExpenseData, updateType: 'add_expense'}, 'খরচ সফলভাবে যুক্ত হয়েছে!')} disabled={isUpdating} className={`flex-1 py-3 rounded-xl text-white font-bold flex justify-center items-center transition-colors bg-red-500 hover:bg-red-600 ${isUpdating ? 'opacity-70 cursor-not-allowed' : ''}`}>
                                        {isUpdating ? <i className="fas fa-spinner fa-spin"></i> : 'খরচ যোগ করুন'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Content Viewing Modals */}
                    {showExpenseList && (
                        <div className="fixed inset-0 z-50 flex flex-col justify-end bg-gray-900/40 backdrop-blur-sm transition-all p-4">
                            <div className="bg-white w-full max-w-md mx-auto rounded-3xl max-h-[85vh] flex flex-col shadow-2xl animate-slide-up">
                                <div className="flex justify-between items-center p-6 border-b border-gray-100">
                                    <h2 className="text-xl font-bold text-gray-900">সংগঠনের সকল খরচ</h2>
                                    <button onClick={() => setShowExpenseList(false)} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="p-6 overflow-y-auto space-y-3 flex-1 no-scrollbar">
                                    {expensesData.length > 0 ? expensesData.map((exp, idx) => (
                                        <div key={idx} className="bg-gray-50 p-4 rounded-xl flex justify-between items-center border border-gray-100">
                                            <div>
                                                <p className="font-semibold text-gray-800">{exp.purpose}</p>
                                                <p className="text-xs text-gray-500 mt-0.5"><i className="far fa-calendar-alt mr-1"></i>{exp.date}</p>
                                            </div>
                                            <p className="font-bold text-red-500">- ৳{exp.amount}</p>
                                        </div>
                                    )) : (
                                        <div className="text-center text-gray-500 py-10">
                                            <i className="fas fa-receipt text-4xl mb-3 opacity-30"></i>
                                            <p>কোনো খরচের রেকর্ড নেই</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {showNotices && (
                        <div className="fixed inset-0 z-50 flex flex-col justify-end bg-gray-900/40 backdrop-blur-sm transition-all p-4">
                            <div className="bg-white w-full max-w-md mx-auto rounded-t-3xl rounded-b-3xl max-h-[80vh] flex flex-col shadow-2xl animate-slide-up">
                                <div className="flex justify-between items-center p-6 border-b border-gray-100">
                                    <h2 className="text-xl font-bold text-gray-900">নোটিশ বোর্ড</h2>
                                    <button onClick={() => setShowNotices(false)} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="p-6 overflow-y-auto no-scrollbar space-y-4 flex-1">
                                    {notices.length > 0 ? notices.map((notice, index) => (
                                        <div key={index} className="bg-[#f8f9fd] p-4 rounded-2xl border border-gray-100 flex gap-4">
                                            <div className={`w-10 h-10 rounded-full ${currentTheme.bgLight} ${currentTheme.accent} flex-shrink-0 flex items-center justify-center mt-1`}>
                                                <i className="fas fa-bell"></i>
                                            </div>
                                            <div>
                                                <h3 className="font-semibold text-gray-900">{notice.title}</h3>
                                                <p className="text-sm text-gray-600 mt-1 leading-relaxed">{notice.message}</p>
                                                <p className="text-xs text-gray-400 mt-2 font-medium"><i className="far fa-clock mr-1"></i>{notice.date}</p>
                                            </div>
                                        </div>
                                    )) : (
                                        <div className="text-center text-gray-500 py-10">
                                            <i className="far fa-bell-slash text-4xl mb-3 opacity-30"></i>
                                            <p>নতুন কোনো নোটিশ নেই</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {showAboutUs && (
                        <div className="fixed inset-0 z-50 flex flex-col justify-end bg-gray-900/40 backdrop-blur-sm transition-all p-4">
                            <div className="bg-white w-full max-w-md mx-auto rounded-3xl max-h-[85vh] flex flex-col shadow-2xl animate-slide-up">
                                <div className="flex justify-between items-center p-6 border-b border-gray-100">
                                    <h2 className="text-xl font-bold text-gray-900">About Us</h2>
                                    <button onClick={() => setShowAboutUs(false)} className="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-200 transition-colors">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="p-6 overflow-y-auto no-scrollbar">
                                    <div className="whitespace-pre-wrap text-sm text-gray-600 leading-relaxed">{aboutUsText || 'Loading...'}</div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showJoinForm && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm transition-opacity">
                            <div className="bg-white w-full max-w-sm rounded-[24px] overflow-hidden shadow-2xl animate-slide-up flex flex-col h-[85vh]">
                                <div className={`p-4 flex justify-between items-center ${currentTheme.primary} text-white`}>
                                    <h2 className="text-lg font-bold flex items-center gap-2"><i className="fas fa-user-plus"></i> সদস্যপদ আবেদন</h2>
                                    <button onClick={() => setShowJoinForm(false)} className="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center hover:bg-white/30 transition-colors">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <div className="w-full flex-1 overflow-hidden bg-[#f0ebf8]">
                                    {GOOGLE_FORM_URL ? (
                                        <iframe 
                                            src={GOOGLE_FORM_URL.includes('?') ? GOOGLE_FORM_URL + '&embedded=true' : GOOGLE_FORM_URL + '?embedded=true'} 
                                            width="100%" 
                                            height="100%" 
                                            frameBorder="0" 
                                            marginHeight="0" 
                                            marginWidth="0" 
                                            className="w-full h-full border-none bg-transparent">
                                            লোড হচ্ছে...
                                        </iframe>
                                    ) : (
                                        <div className="flex flex-col items-center justify-center h-full text-center p-8 text-gray-500">
                                            <p className="font-semibold text-gray-700">ফর্ম সেটআপ করা হয়নি</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Main Application Routes */}
                    <div className="h-full overflow-y-auto no-scrollbar">
                        {activeTab === 'home' && renderHeader('Home')}
                        {activeTab === 'members' && renderHeader('Directory')}
                        {activeTab === 'home' && renderHome()}
                        {activeTab === 'members' && renderMembers()}
                        {activeTab === 'profile' && renderProfile()}
                    </div>

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-gray-100 flex justify-between px-8 py-3 pb-safe z-40 rounded-t-3xl shadow-[0_-4px_20px_rgba(0,0,0,0.03)]">
                        <button 
                            onClick={() => setActiveTab('home')} 
                            className={`flex flex-col items-center gap-1 w-16 transition-colors ${activeTab === 'home' ? currentTheme.accent : 'text-gray-400 hover:text-gray-600'}`}
                        >
                            <i className={`text-xl ${activeTab === 'home' ? 'fas' : 'far'} fa-home`}></i>
                            <span className="text-[10px] font-semibold">Home</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('members')} 
                            className={`flex flex-col items-center gap-1 w-16 transition-colors ${activeTab === 'members' || activeTab === 'profile' ? currentTheme.accent : 'text-gray-400 hover:text-gray-600'}`}
                        >
                            <i className={`text-xl ${activeTab === 'members' || activeTab === 'profile' ? 'fas' : 'far'} fa-folder`}></i>
                            <span className="text-[10px] font-semibold">Directory</span>
                        </button>
                        <button 
                            onClick={() => {
                                fetchAllData(); 
                                showToast('ডেটা রিফ্রেশ করা হচ্ছে...', 'info');
                            }} 
                            className="flex flex-col items-center gap-1 w-16 text-gray-400 hover:text-gray-600 transition-colors active:scale-90"
                        >
                            <i className={`text-xl fas fa-sync-alt ${syncStatus === 'Syncing...' ? `fa-spin ${currentTheme.accent}` : ''}`}></i>
                            <span className="text-[10px] font-semibold">Refresh</span>
                        </button>
                    </nav>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<BondhanApp />);
    </script>
</body>
</html>
